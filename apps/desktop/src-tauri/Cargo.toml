[package]
name = "hacktitlan-desktop"
version = "0.1.0"
description = "Clasificador LIGIE - aplicación de escritorio"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hacktitlan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
